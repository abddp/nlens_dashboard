<!-- Revenue Breakdown Chart (Exact visual replica of reference design) -->
<div class="bg-[var(--bg-card)] border border-[var(--border-card)] rounded-2xl p-6 shadow-sm flex flex-col justify-between">
    <!-- Top Header Row -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <h3 class="text-xs uppercase tracking-wider font-extrabold text-[var(--text-muted)]">REVENUE BREAKDOWN</h3>
            <span class="text-xs text-[var(--text-faint)] cursor-pointer" title="Daily transaction and stream volume">ⓘ</span>
        </div>
        <button type="button" class="text-[var(--text-faint)] hover:text-[var(--text-main)] transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="2" />
                <circle cx="12" cy="12" r="2" />
                <circle cx="19" cy="12" r="2" />
            </svg>
        </button>
    </div>

    <!-- Subtitle & Value Header -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <span class="text-[11px] font-medium text-[var(--text-faint)] block mb-0.5">Revenue by Category</span>
            <div id="breakdown-headline-total" class="text-xl md:text-2xl font-black text-[var(--text-main)] tracking-tight">
                <span class="skeleton inline-block h-7 w-24 rounded-lg"></span>
            </div>
        </div>

        <!-- Date Range Pill -->
        <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-[var(--bg-card-raised)] border border-[var(--border-subtle)] text-[11px] font-medium text-[var(--text-muted)] cursor-pointer hover:text-[var(--text-main)] transition">
            <svg class="w-3 h-3 text-[var(--text-faint)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Jan 1 - Aug 30</span>
            <svg class="w-3 h-3 text-[var(--text-faint)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </div>
    </div>

    <!-- AI Insight Pill Button (Matching reference design) -->
    <div class="mb-4 px-3.5 py-2.5 rounded-xl bg-[var(--bg-card-raised)] border border-[var(--border-subtle)] flex items-center justify-between text-xs cursor-pointer hover:border-[var(--primary-accent)]/30 transition group">
        <div class="flex items-center gap-2.5">
            <div class="w-4 h-4 text-[var(--primary-accent)] flex items-center justify-center">
                ✨
            </div>
            <span class="font-medium text-[var(--text-muted)] group-hover:text-[var(--text-main)] transition">Get AI insight for better analysis</span>
        </div>
        <svg class="w-3.5 h-3.5 text-[var(--text-faint)] group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
    </div>

    <!-- Thin Bar Canvas Container -->
    <div class="relative w-full h-52 md:h-56 select-none" id="breakdown-chart-wrapper">
        <!-- Skeleton while loading -->
        <div id="breakdown-chart-skeleton" class="skeleton w-full h-full rounded-xl flex items-center justify-center">
            <span class="text-xs text-[var(--text-faint)] font-semibold">Loading breakdown...</span>
        </div>

        <!-- SVG Container -->
        <div id="breakdown-chart-container" class="w-full h-full hidden"></div>
    </div>
</div>
