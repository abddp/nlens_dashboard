<!-- Main Matrix Sales & Growth Trend Chart (Exact replica of reference design) -->
<div class="bg-[var(--bg-card)] border border-[var(--border-card)] rounded-2xl p-6 shadow-sm flex flex-col justify-between">
    <!-- Top Header Row -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <h3 class="text-xs uppercase tracking-wider font-extrabold text-[var(--text-muted)]">SALES TREND</h3>
            <span class="text-xs text-[var(--text-faint)] cursor-pointer" title="Revenue and user acquisition growth trends">ⓘ</span>
        </div>
        <button type="button" class="text-[var(--text-faint)] hover:text-[var(--text-main)] transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="2" />
                <circle cx="12" cy="12" r="2" />
                <circle cx="19" cy="12" r="2" />
            </svg>
        </button>
    </div>

    <!-- Metric Headline, Legend & Timeframe Switcher -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
        <!-- Headline Value -->
        <div class="flex items-baseline gap-2">
            <span class="text-xs font-semibold text-[var(--text-muted)]">Total Revenue :</span>
            <span id="main-chart-headline-total" class="text-xl md:text-2xl font-black text-[var(--text-main)] tracking-tight">
                <span class="skeleton inline-block h-7 w-28 rounded-lg"></span>
            </span>
        </div>

        <!-- Legend & Granularity Pills -->
        <div class="flex flex-wrap items-center gap-5">
            <!-- Custom Legend (New User vs Existing User / Revenue) -->
            <div class="flex items-center gap-4 text-xs font-semibold">
                <div class="flex items-center gap-1.5 text-[var(--text-muted)]">
                    <span class="w-2 h-2 rounded-full bg-[var(--chart-matrix-filled-secondary)]"></span>
                    <span class="text-[11px] uppercase tracking-wider font-bold">NEW USER</span>
                </div>
                <div class="flex items-center gap-1.5 text-[var(--text-main)]">
                    <span class="w-2 h-2 rounded-full bg-[var(--primary-accent)]"></span>
                    <span class="text-[11px] uppercase tracking-wider font-bold text-[var(--primary-accent)]">EXISTING USER</span>
                </div>
            </div>

            <!-- Granularity Switcher Pills (Weekly, Monthly, Yearly) -->
            <div class="flex items-center bg-[var(--bg-card-raised)] border border-[var(--border-subtle)] rounded-xl p-1 text-[11px]">
                <button type="button" class="px-2.5 py-1 rounded-lg font-medium text-[var(--text-muted)] hover:text-[var(--text-main)] transition">
                    Weekly
                </button>
                <button type="button" class="px-2.5 py-1 rounded-lg font-bold bg-[var(--border-card)] text-[var(--text-main)] shadow-sm transition">
                    Monthly
                </button>
                <button type="button" class="px-2.5 py-1 rounded-lg font-medium text-[var(--text-muted)] hover:text-[var(--text-main)] transition">
                    Yearly
                </button>
            </div>
        </div>
    </div>

    <!-- Chart Visual Canvas Container -->
    <div class="relative w-full h-72 md:h-80 select-none" id="main-trend-chart-wrapper">
        <!-- Skeleton while loading -->
        <div id="main-chart-skeleton" class="skeleton w-full h-full rounded-xl flex items-center justify-center">
            <span class="text-xs text-[var(--text-faint)] font-semibold">Loading matrix trend chart...</span>
        </div>

        <!-- SVG Matrix Container -->
        <div id="main-trend-chart-container" class="w-full h-full hidden"></div>

        <!-- Floating Tooltip (Dark box with circle guide) -->
        <div id="main-chart-tooltip" class="absolute pointer-events-none hidden bg-[var(--chart-tooltip-bg)] text-[var(--chart-tooltip-text)] text-xs rounded-xl px-3.5 py-2.5 shadow-2xl border border-[var(--border-card)] transition-all duration-75 z-20">
        </div>
    </div>
</div>
