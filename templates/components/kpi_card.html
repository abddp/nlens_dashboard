<!-- KPI Card -->
<div class="kpi-card bg-[var(--bg-card)] border border-[var(--border-card)] rounded-2xl p-5 hover:border-[var(--primary-accent)]/40 transition-all duration-200 flex flex-col justify-between shadow-sm relative group" data-kpi="{{ kpi_id }}">
    <!-- Top Row: Title & Mini Sparkline Curve -->
    <div class="flex items-start justify-between gap-2">
        <div>
            <span class="text-[10px] uppercase tracking-wider font-bold text-[var(--text-muted)] block">
                {{ title }}
            </span>
        </div>
        
        <!-- Mini Sparkline Curve SVG -->
        <div class="w-16 h-7 flex items-center justify-end">
            <svg id="sparkline-{{ kpi_id }}" class="w-full h-full overflow-visible"></svg>
        </div>
    </div>

    <!-- Main Value Row -->
    <div class="my-2.5">
        <div class="flex items-baseline gap-2">
            <div id="kpi-val-{{ kpi_id }}" class="text-2xl lg:text-3xl font-extrabold text-[var(--text-main)] tracking-tight">
                <div class="skeleton h-8 w-24 rounded-lg my-1"></div>
            </div>
            {% if sub_unit %}
            <span class="text-xs font-semibold text-[var(--text-muted)]">{{ sub_unit }}</span>
            {% endif %}
        </div>
    </div>

    <!-- Bottom Row: Subtext Info -->
    <div class="flex items-center justify-between pt-2 border-t border-[var(--border-subtle)] text-[11px]">
        <div id="kpi-sub-{{ kpi_id }}" class="text-[var(--text-faint)] font-medium">
            <span>vs previous</span>
        </div>
    </div>
</div>
