<!-- User Activity & Platform Sessions Chart Component -->
<div class="bg-[var(--bg-card)] border border-[var(--border-card)] rounded-2xl p-6 shadow-sm flex flex-col justify-between">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <h3 class="text-xs uppercase tracking-wider font-extrabold text-[var(--text-muted)]">ACTIVE USERS & SESSIONS</h3>
            <span class="text-xs text-[var(--text-faint)] cursor-pointer" title="Daily active accounts vs platform visits">ⓘ</span>
        </div>
        <div class="flex items-center gap-3 text-xs font-semibold">
            <div class="flex items-center gap-1.5 text-[var(--primary-accent)]">
                <span class="w-2 h-2 rounded-full bg-[var(--primary-accent)]"></span>
                <span class="text-[10px] uppercase tracking-wider font-bold">Active Users</span>
            </div>
            <div class="flex items-center gap-1.5 text-[var(--text-muted)]">
                <span class="w-2 h-2 rounded-full bg-[var(--chart-matrix-filled-secondary)]"></span>
                <span class="text-[10px] uppercase tracking-wider font-bold">Sessions</span>
            </div>
        </div>
    </div>

    <!-- Values Summary Row -->
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-[var(--border-subtle)]">
        <div>
            <span class="text-[10px] font-semibold uppercase tracking-wider text-[var(--text-faint)] block">Active Users</span>
            <span id="activity-headline-active" class="text-lg font-extrabold text-[var(--text-main)]">
                <span class="skeleton inline-block h-6 w-16 rounded"></span>
            </span>
        </div>
        <div class="text-right">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-[var(--text-faint)] block">Total Sessions</span>
            <span id="activity-headline-sessions" class="text-lg font-extrabold text-[var(--text-main)]">
                <span class="skeleton inline-block h-6 w-16 rounded"></span>
            </span>
        </div>
    </div>

    <!-- Chart Canvas -->
    <div class="relative w-full h-48 select-none" id="activity-chart-wrapper">
        <div id="activity-chart-skeleton" class="skeleton w-full h-full rounded-xl flex items-center justify-center">
            <span class="text-xs text-[var(--text-faint)] font-semibold">Loading engagement data...</span>
        </div>
        <div id="activity-chart-container" class="w-full h-full hidden"></div>
    </div>
</div>
