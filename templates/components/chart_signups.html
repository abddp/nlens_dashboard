<!-- KPI 4: Sign-ups -->
<div class="group bg-[var(--bg-card)] border border-[var(--border-card)] rounded-2xl p-6 shadow-sm flex flex-col justify-between hover:border-[var(--primary-accent)]/30 transition-all duration-200" data-kpi-card="signups">
    <!-- Header Row -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-1.5">
            <h3 class="text-xs uppercase tracking-wider font-extrabold text-[var(--text-muted)]">INSCRIPTIONS</h3>
            {% include "components/kpi_info_popover.html" with meaning="Nombre total de nouveaux comptes utilisateurs créés sur la plateforme. Mesure l'efficacité de l'acquisition." formula="COUNT(*) GROUP BY joined_on__date" source="users" %}
        </div>
        <div class="flex items-center gap-3">
            <!-- Discreet Legend -->
            <div class="hidden sm:flex items-center gap-3 text-[10px] text-[var(--text-faint)] font-medium select-none">
                <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded-full bg-[var(--primary-accent)]"></span>Actuel</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 border-t border-dashed border-[var(--text-faint)]"></span>Précédent</span>
            </div>
            <!-- Export JSON Button -->
            <button type="button" data-export-kpi="signups" class="p-1.5 rounded-lg bg-[var(--bg-card-raised)] hover:bg-[var(--border-subtle)] text-[var(--text-muted)] hover:text-[var(--primary-accent)] transition-colors cursor-pointer" title="Exporter les données (JSON)">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Headline Value -->
    <div class="mb-4 flex items-baseline justify-between">
        <div id="signups-chart-headline" class="text-xl md:text-2xl font-black text-[var(--text-main)] tracking-tight">
            <span class="skeleton inline-block h-7 w-20 rounded-lg"></span>
        </div>
        <div id="signups-chart-variation" class="text-xs font-bold"></div>
    </div>

    <!-- Chart Canvas Container -->
    <div class="relative w-full h-64 select-none" id="signups-chart-wrapper">
        <div id="signups-chart-skeleton" class="skeleton w-full h-full rounded-xl flex items-center justify-center">
            <span class="text-xs text-[var(--text-faint)] font-semibold">Loading sign-ups...</span>
        </div>
        <div id="signups-chart-container" class="w-full h-full hidden"></div>
    </div>
</div>
