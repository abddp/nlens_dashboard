<!-- Reusable KPI Info Popover Component -->
<div class="relative group/info inline-flex items-center">
    <button type="button" 
            class="text-[var(--text-faint)] hover:text-[var(--primary-accent)] transition-colors p-1 rounded-lg hover:bg-[var(--bg-card-raised)] cursor-help focus:outline-none" 
            aria-label="Comprendre cette métrique" 
            title="Comprendre ce graphique">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </button>
    
    <!-- Floating Info Card Popover -->
    <div class="pointer-events-none group-hover/info:pointer-events-auto opacity-0 group-hover/info:opacity-100 transition-all duration-200 absolute left-0 top-full mt-2 z-50 w-72 sm:w-84 max-w-[calc(100vw-3rem)] p-4 bg-[var(--bg-card)]/95 backdrop-blur-md border border-[var(--border-card)] rounded-2xl shadow-2xl space-y-3">
        <!-- Signification -->
        <div>
            <div class="flex items-center gap-1.5 mb-1.5">
                <span class="w-2 h-2 rounded-full bg-[var(--primary-accent)]"></span>
                <span class="font-extrabold text-xs text-[var(--text-main)]">Signification</span>
            </div>
            <p class="text-[11px] text-[var(--text-muted)] leading-relaxed">
                {{ meaning }}
            </p>
        </div>

        <!-- Calcul & Formule -->
        <div class="pt-2.5 border-t border-[var(--border-subtle)]">
            <span class="font-extrabold text-[10px] uppercase tracking-wider text-[var(--text-faint)] block mb-1">
                🧮 Méthode de calcul
            </span>
            <div class="bg-[var(--bg-card-raised)] border border-[var(--border-subtle)] rounded-lg p-2 font-mono text-[10px] text-[var(--primary-accent)] leading-relaxed break-words">
                {{ formula }}
            </div>
        </div>

        <!-- Source de Données -->
        <div class="pt-2 border-t border-[var(--border-subtle)] flex items-center justify-between text-[10px]">
            <span class="text-[var(--text-faint)] font-medium">Source :</span>
            <code class="px-1.5 py-0.5 rounded bg-[var(--bg-card-raised)] text-[var(--text-main)] font-semibold border border-[var(--border-subtle)]">{{ source }}</code>
        </div>
    </div>
</div>
